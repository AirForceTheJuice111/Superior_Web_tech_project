server:
  port: 8080

spring:
  application:
    name: mlplatform-backend
  datasource:
    url: jdbc:h2:file:./data/mlplatform;MODE=MYSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.mlplatform.persistence.entity

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
  python:
    base-url: http://localhost:8000
    timeout-ms: 5000
  dataset-upload:
    max-rows: 1000
    max-columns: 50
    max-cell-length: 256
    preview-limit: 20
  jwt:
    # 密钥优先读环境变量 APP_JWT_SECRET，缺省值仅供本地教学演示，生产务必覆盖。
    secret: ${APP_JWT_SECRET:change-me-in-production-please-use-a-long-random-secret}
    expiration-minutes: 120
    issuer: mlplatform
