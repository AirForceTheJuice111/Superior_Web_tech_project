server:
  port: 8080
  tomcat:
    # 限制请求体吞咽上限（约 4MB），防止超大上传 JSON 撑爆堆；声明式行数/列数上限见 UploadDatasetRequest。
    max-swallow-size: 4MB
    max-http-form-post-size: 4MB

spring:
  application:
    name: mlplatform-backend
  datasource:
    url: jdbc:h2:file:./data/mlplatform;MODE=MYSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.mlplatform.persistence.entity

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
  python:
    base-url: http://localhost:8000
    timeout-ms: 5000
  dataset-upload:
    max-rows: 1000
    max-columns: 50
    max-cell-length: 256
    preview-limit: 20
  jwt:
    # 密钥必须经环境变量 APP_JWT_SECRET 注入（≥32 字符随机串），无内置默认值。
    # 本地开发示例：export APP_JWT_SECRET=$(openssl rand -hex 32)
    secret: ${APP_JWT_SECRET:}
    expiration-minutes: 120
    issuer: mlplatform
