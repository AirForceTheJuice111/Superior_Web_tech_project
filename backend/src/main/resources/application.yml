server:
  port: 8080

spring:
  application:
    name: mlplatform-backend
  datasource:
    url: jdbc:h2:file:./data/mlplatform;MODE=MYSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.mlplatform.persistence.entity

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
  python:
    base-url: http://localhost:8000
    timeout-ms: 5000
  ai:
    enabled: true
    base-url: ${APP_AI_BASE_URL:https://api.deerapi.com/v1}
    api-key: ${APP_AI_API_KEY:}
    model: ${APP_AI_MODEL:deepseek-v4-pro}
    timeout-ms: 60000
    max-tokens: 1024
    temperature: 0.6
