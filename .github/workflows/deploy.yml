name: Deploy develop to VPS

on:
  push:
    branches: [develop]
  workflow_dispatch:        # 允许在 GitHub 页面手动触发

concurrency:
  group: deploy-vps         # 同一时间只跑一次部署,避免并发冲突
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 不把 token 写进 .git,避免被 scp 带到服务器

      - name: Upload source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/root/mlplatform"
          overwrite: true

      - name: Rebuild & restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/mlplatform
            rm -rf .git                 # 清掉每次 scp 带上来的 .git,保持服务器干净
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
