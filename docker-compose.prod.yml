name: mlplatform

services:
  python:
    build: ./python-service
    image: mlplatform-python:latest
    restart: always
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    image: mlplatform-backend:latest
    restart: always
    environment:
      APP_PYTHON_BASE_URL: "http://python:8000"
      APP_AI_API_KEY: "${APP_AI_API_KEY:-}"
      APP_AI_BASE_URL: "${APP_AI_BASE_URL:-https://api.deerapi.com/v1}"
      APP_AI_MODEL: "${APP_AI_MODEL:-deepseek-v4-pro}"
    expose:
      - "8080"
    depends_on:
      python:
        condition: service_healthy
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: mlplatform-frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
